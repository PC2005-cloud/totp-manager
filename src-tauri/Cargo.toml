[package]
name = "totp-manager"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
time = "0.3"

[lib]
name = "totp_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
