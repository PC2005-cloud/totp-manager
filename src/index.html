<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOTP Manager</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      // 尽早把主题定下来，避免亮色用户先闪一帧深色。
      // 必须内联在 head：main.js 是 module（延迟执行），等它跑就已经渲染过了。
      // 规则：用户选过就听用户的，没选过就跟着系统走。
      (() => {
        const saved = localStorage.getItem("theme");
        const light = saved
          ? saved === "light"
          : window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <!-- 整个 header 就是自绘标题栏：原生标题栏已在 tauri.conf.json 里关掉
         （decorations: false）。拖动、双击最大化、最小化/最大化/关闭都在
         main.js 的「自绘标题栏」一节里接上。 -->
    <header id="titlebar">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>TOTP Manager</h1>
      </div>

      <div class="header-actions">
        <button id="btn-theme" class="btn btn-ghost btn-icon" title="切换主题">☀</button>

        <!-- 分隔线：左边是应用操作，右边是窗口操作 -->
        <span class="win-sep"></span>

        <div class="win-controls">
          <button id="win-min" class="win-btn" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 5h9" /></svg>
          </button>

          <button id="win-max" class="win-btn" title="最大化" aria-label="最大化">
            <!-- 两个图标都在，靠 body.is-maximized 决定显示哪个 -->
            <svg class="ico-max" viewBox="0 0 10 10" aria-hidden="true">
              <rect x="0.6" y="0.6" width="8.8" height="8.8" rx="1.4" />
            </svg>
            <svg class="ico-restore" viewBox="0 0 10 10" aria-hidden="true">
              <rect x="0.6" y="2.6" width="6.8" height="6.8" rx="1.4" />
              <path d="M2.6 2.6V0.6h6.8v6.8h-2" />
            </svg>
          </button>

          <button id="win-close" class="win-btn win-close" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 10 10" aria-hidden="true">
              <path d="M0.7 0.7l8.6 8.6M9.3 0.7L0.7 9.3" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- 列表视图 -->
    <div id="list-view">
      <div class="searchbar">
        <input id="search" type="text" placeholder="搜索服务或账号…" autocomplete="off" />
        <button id="btn-add" class="btn btn-primary">+ 添加</button>
      </div>
      <main id="list"></main>
    </div>

    <!-- 新增 / 编辑表单视图 -->
    <div id="form-view">
      <h2 id="form-title">新增账号</h2>

      <div class="field">
        <label for="f-service">
          服务 <span class="req">*</span>
          <span class="tip">可下拉选已有，也可输入新的</span>
        </label>
        <!-- 不用 <datalist>：它的弹层是 WebView 之外的独立窗口，无边框窗口下
             点不动也选不上，而且刷新时会把它顶掉。这里用自绘的下拉。 -->
        <div class="combo">
          <input
            id="f-service"
            type="text"
            autocomplete="off"
            placeholder="GitHub"
            role="combobox"
            aria-expanded="false"
            aria-controls="f-service-menu"
          />
          <button
            type="button"
            id="f-service-caret"
            class="combo-caret"
            tabindex="-1"
            title="展开已有服务"
            aria-label="展开已有服务"
          >
            ▾
          </button>
          <div id="f-service-menu" class="combo-menu" role="listbox" hidden></div>
        </div>
      </div>

      <div class="field">
        <label for="f-account">账号 <span class="req">*</span></label>
        <input id="f-account" type="text" autocomplete="off" placeholder="me@company.com" />
      </div>

      <div class="field">
        <label for="f-secret">密钥（Base32）</label>
        <input
          id="f-secret"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="JBSWY3DPEHPK3PXP"
        />
      </div>

      <div class="field">
        <label for="f-codes">恢复码<span class="tip">每行一个，可留空</span></label>
        <textarea
          id="f-codes"
          rows="4"
          spellcheck="false"
          placeholder="a1b2c3d4e5&#10;f6g7h8i9j0"
        ></textarea>
      </div>

      <div class="field">
        <label for="f-note">备注</label>
        <input id="f-note" type="text" placeholder="可留空" />
      </div>

      <p id="form-error" class="error"></p>

      <div class="form-actions">
        <button id="btn-save" class="btn btn-primary">保存</button>
        <button id="btn-cancel" class="btn btn-ghost">取消</button>
      </div>
    </div>

    <footer id="vault-path"></footer>

    <script type="module" src="main.js"></script>
  </body>
</html>
